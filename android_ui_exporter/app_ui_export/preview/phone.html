<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captured Phone UI</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #101114;
    }
    body {
      display: grid;

    }
  </style>

  <img src="frame0.png" alt="Captured phone UI">
